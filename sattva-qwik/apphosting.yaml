# Firebase App Hosting config for the Qwik SSR site.
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2
  concurrency: 80

scripts:
  buildCommand: npm run build.prod
  runCommand: node server/entry.express.js

env:
  - variable: NODE_ENV
    value: production
    availability: [RUNTIME]

  # Public URL of the API backend (browser-visible — must be BUILD).
  - variable: PUBLIC_API_URL
    value: https://api--devutsav-4e90c.us-central1.hosted.app
    availability: [BUILD, RUNTIME]
  - variable: INTERNAL_API_URL
    value: https://api--devutsav-4e90c.us-central1.hosted.app
    availability: [BUILD, RUNTIME]
